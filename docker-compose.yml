services:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GHOST_DEV_API_KEY=dev-test-key-minimum-32-characters-long
      - GHOST_DEV_TENANT_ID=shophive_demo
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  shophive-backend:
    build:
      context: .
      dockerfile: demo/shophive/backend/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - GHOST_CURSOR_API_KEY=dev-test-key-minimum-32-characters-long
      - GHOST_CURSOR_SERVICE_URL=http://orchestrator:8080
      - GHOST_CURSOR_TENANT_ID=shophive_demo
    depends_on:
      orchestrator:
        condition: service_healthy

